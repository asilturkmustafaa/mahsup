textarea#fb{width:100%;min-height:140px;font:15px var(--f-body);border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--surface);padding:12px 18px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);z-index:30;text-align:center}
.spin{width:28px;height:28px;border:3px solid var(--track);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

<main id="app"><div class="spin" role="status" aria-label="Yükleniyor"></div></main>
<div id="fbWrap" style="max-width:560px;margin:12px auto 0" hidden><textarea id="fb" readonly aria-label="Kopyalanacak metin"></textarea></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const fmt=k=>(k/100).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';
const sfmt=k=>(k>0?'+':k<0?'−':'')+fmt(Math.abs(k));
const cmp=(a,b)=>a.localeCompare(b,'tr');
const TYPES={ofis:'Ofis',etkinlik:'Etkinlik',ev:'Ev',diger:'Diğer'};
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const newCode=()=>Array.from(crypto.getRandomValues(new Uint32Array(10)),n=>ALPH[n%ALPH.length]).join('');
const showCode=c=>String(c||'').replace(/^(.{4})(.{3})(.{3})$/,'$1-$2-$3');
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const monthName=m=>{const [y,mo]=m.split('-');return AYLAR[+mo-1]+' '+y;};
function parseAmount(v){
  let s=String(v).replace(/[\s₺]|TL/gi,'');if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if((s.match(/\./g)||[]).length>1||/^\d{1,3}\.\d{3}$/.test(s))s=s.replace(/\./g,'');
  const n=Number(s);return isFinite(n)?Math.round(n*100):NaN;
}
let params;try{params=new URLSearchParams(location.search)}catch(e){params=new URLSearchParams()}

const S={view:'loading',user:null,groups:[],gid:null,g:null,members:[],expenses:[],tab:'giderler',
  month:today().slice(0,7),draft:null,newG:null,joinCode:normCode(params.get('kod')),demo:false,err:''};
let B=null,unMy=null,unG=null,deferred=false;

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200);}
function fail(e){
  const c=e&&e.code;
  if(c==='permission-denied')return toast('Bu işlem için yetkiniz yok.');
  if(c==='no-code')return toast('Bu kodla bir grup bulunamadı. Kodu kontrol edin.');
  toast(AUTH_ERR[c]||'İşlem tamamlanamadı. Bağlantınızı kontrol edip tekrar deneyin.');
}
const AUTH_ERR={'auth/invalid-email':'E-posta adresi geçersiz.','auth/weak-password':'Şifre en az 6 karakter olmalı.',
  'auth/missing-password':'Şifrenizi yazın.','wrong-password':'Bu e-posta kayıtlı ama şifre hatalı. "Şifremi unuttum" ile sıfırlayabilirsiniz.',
  'auth/popup-closed-by-user':'Giriş penceresi kapatıldı.','auth/cancelled-popup-request':'Giriş penceresi kapatıldı.',
  'auth/unauthorized-domain':'Bu adres Firebase\'de yetkili değil (KURULUM.md, 6. adım).',
  'auth/operation-not-allowed':'Bu giriş yöntemi Firebase\'de açılmamış (KURULUM.md, 3. adım).',
  'auth/too-many-requests':'Çok fazla deneme yapıldı. Biraz sonra tekrar deneyin.','auth/network-request-failed':'İnternet bağlantısı yok.'};
function copy(txt,ok){
  const p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject();
  p.then(()=>{$('#fbWrap').hidden=true;toast(ok);},()=>{const f=$('#fb');f.value=txt;$('#fbWrap').hidden=false;f.focus();f.select();toast('Metni seçtim, kopyalayabilirsiniz.');});
}
function armed(btn,label,fn){
  if(!btn.hasAttribute('data-armed')){const o=btn.textContent;btn.setAttribute('data-armed','');btn.textContent=label;
    setTimeout(()=>{if(btn.isConnected){btn.removeAttribute('data-armed');btn.textContent=o;}},4000);return;}
  Promise.resolve().then(fn).catch(fail);
}

/* ================= Firebase arka ucu ================= */
async function firebaseBackend(cfg){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,Au,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const fa=A.initializeApp(cfg),auth=Au.getAuth(fa),db=F.getFirestore(fa);auth.languageCode='tr';
  const users=uid=>F.doc(db,'users',uid);
  return {
    onAuth(cb){Au.getRedirectResult(auth).catch(fail);Au.onAuthStateChanged(auth,u=>cb(u?{uid:u.uid,name:u.displayName||'',email:u.email||''}:null));},
    google(){const p=new Au.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
      return Au.signInWithPopup(auth,p).catch(e=>{if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')return Au.signInWithRedirect(auth,p);throw e;});},
    async email(email,pw){
      try{await Au.signInWithEmailAndPassword(auth,email,pw);}
      catch(e){
        if(!['auth/invalid-credential','auth/user-not-found','auth/invalid-login-credentials','auth/wrong-password'].includes(e.code))throw e;
        try{await Au.createUserWithEmailAndPassword(auth,email,pw);}
        catch(e2){if(e2.code==='auth/email-already-in-use')throw{code:'wrong-password'};throw e2;}
      }
    },
    reset:email=>Au.sendPasswordResetEmail(auth,email),
    signOut:()=>Au.signOut(auth),
    watchMyGroups(uid,cb){
      const subs={},info={};let map={};
      const emit=()=>cb(Object.keys(map).map(gid=>Object.assign({id:gid},map[gid],info[gid]||{status:'loading'})).filter(g=>g.status!=='gone'));
      const u=F.onSnapshot(users(uid),s=>{
        map=(s.exists()&&s.data().groups)||{};
        Object.keys(map).forEach(gid=>{if(subs[gid])return;
          subs[gid]=F.onSnapshot(F.doc(db,'groups',gid,'members',uid),
            m=>{info[gid]=m.exists()?{status:m.data().status,role:m.data().role}:{status:'gone'};emit();},
            ()=>{info[gid]={status:'gone'};emit();});});
        Object.keys(subs).forEach(gid=>{if(!map[gid]){subs[gid]();delete subs[gid];}});
        emit();
      },()=>cb([]));
      return()=>{u();Object.values(subs).forEach(f=>f());};
    },
    async createGroup(user,{name,type,myName,approval}){
      for(let i=0;i<3;i++){
        const g=F.doc(F.collection(db,'groups')),code=newCode(),b=F.writeBatch(db);
        b.set(g,{name,type,code,adminUid:user.uid,approval:!!approval,createdAt:F.serverTimestamp()});
        b.set(F.doc(db,'groups',g.id,'members',user.uid),{uid:user.uid,name:myName,email:user.email||'',role:'admin',status:'active',joinedAt:F.serverTimestamp()});
        b.set(F.doc(db,'codes',code),{gid:g.id,name,type,approval:!!approval,adminUid:user.uid});
        b.set(users(user.uid),{groups:{[g.id]:{name,type}}},{merge:true});
        try{await b.commit();return g.id;}catch(e){if(e.code!=='permission-denied'||i===2)throw e;}
      }
    },
    async joinByCode(user,code,myName){
      const c=await F.getDoc(F.doc(db,'codes',code));if(!c.exists())throw{code:'no-code'};
      const {gid,name,type,approval}=c.data();const mref=F.doc(db,'groups',gid,'members',user.uid);
      const ex=await F.getDoc(mref);let status;
      if(ex.exists())status=ex.data().status;
      else{status=approval?'pending':'active';
        await F.setDoc(mref,{uid:user.uid,name:myName,email:user.email||'',role:'member',status,code,groupName:name,joinedAt:F.serverTimestamp()});}
      await F.setDoc(users(user.uid),{groups:{[gid]:{name,type}}},{merge:true});
      return{gid,status};
    },
    watchGroup(gid,cb,err){
      const st={group:null,members:[],expenses:[]},fire=()=>cb(st);
      const us=[F.onSnapshot(F.doc(db,'groups',gid),s=>{st.group=s.exists()?s.data():null;fire();},err),
        F.onSnapshot(F.collection(db,'groups',gid,'members'),q=>{st.members=q.docs.map(d=>Object.assign({id:d.id},d.data()));fire();},err),
        F.onSnapshot(F.collection(db,'groups',gid,'expenses'),q=>{st.expenses=q.docs.map(d=>Object.assign({id:d.id},d.data()));fire();},err)];
      return()=>us.forEach(f=>f());
    },
    addExpense:(gid,e)=>F.addDoc(F.collection(db,'groups',gid,'expenses'),e),
    delExpense:(gid,id)=>F.deleteDoc(F.doc(db,'groups',gid,'expenses',id)),
    updateMember:(gid,mid,p)=>F.updateDoc(F.doc(db,'groups',gid,'members',mid),p),
    removeMember:(gid,mid)=>F.deleteDoc(F.doc(db,'groups',gid,'members',mid)),
    addGuest:(gid,name)=>F.addDoc(F.collection(db,'groups',gid,'members'),{uid:null,name,role:'member',status:'active',guest:true,joinedAt:F.serverTimestamp()}),
    async updateGroup(uid,gid,code,p){
      await F.updateDoc(F.doc(db,'groups',gid),p);
      const cp={};if('name' in p)cp.name=p.name;if('approval' in p)cp.approval=p.approval;
      if(Object.keys(cp).length)await F.updateDoc(F.doc(db,'codes',code),cp);
      if('name' in p)await F.setDoc(users(uid),{groups:{[gid]:{name:p.name}}},{merge:true});
    },
    async leave(uid,gid){
      await F.deleteDoc(F.doc(db,'groups',gid,'members',uid)).catch(()=>{});
      await F.updateDoc(users(uid),{['groups.'+gid]:F.deleteField()});
    }
  };
}

/* ================= Önizleme (yerel) arka ucu ================= */
function localBackend(){
  const K='mahsup-demo';let D=null;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
  D=D||{user:null,groups:{},codes:{},my:{}};
  const L=new Set(),save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}L.forEach(f=>f());};
  const sub=f=>{L.add(f);f();return()=>L.delete(f);};
  const rid=()=>Math.random().toString(36).slice(2,10);let authCb=()=>{};
  const login=u=>{D.user=u;save();authCb(u);};
  return{demo:true,
    onAuth(cb){authCb=cb;setTimeout(()=>cb(D.user),0);},
    google:async()=>login({uid:'u_'+rid(),name:'Deneme Kullanıcısı',email:''}),
    email:async e=>login({uid:'u_'+rid(),name:e.split('@')[0],email:e}),
    reset:async()=>{},
    signOut:async()=>login(null),
    watchMyGroups(uid,cb){return sub(()=>cb(Object.keys(D.my).filter(g=>D.groups[g]&&D.groups[g].members[uid])
      .map(g=>({id:g,name:D.groups[g].name,type:D.groups[g].type,status:D.groups[g].members[uid].status,role:D.groups[g].members[uid].role}))));},
    async createGroup(u,{name,type,myName,approval}){const gid='g'+rid(),code=newCode();
      D.groups[gid]={name,type,code,adminUid:u.uid,approval:!!approval,members:{[u.uid]:{uid:u.uid,name:myName,email:u.email,role:'admin',status:'active'}},expenses:{}};
      D.codes[code]=gid;D.my[gid]=1;save();return gid;},
    async joinByCode(u,code,myName){const gid=D.codes[code];if(!gid)throw{code:'no-code'};const g=D.groups[gid];
      if(!g.members[u.uid])g.members[u.uid]={uid:u.uid,name:myName,role:'member',status:g.approval?'pending':'active'};
      D.my[gid]=1;save();return{gid,status:g.members[u.uid].status};},
    watchGroup(gid,cb){return sub(()=>{const g=D.groups[gid];if(!g)return cb({group:null,members:[],expenses:[]});
      cb({group:g,members:Object.entries(g.members).map(([k,v])=>Object.assign({id:k},v)),expenses:Object.entries(g.expenses).map(([k,v])=>Object.assign({id:k},v))});});},
    addExpense:async(gid,e)=>{D.groups[gid].expenses['e'+rid()]=e;save();},
    delExpense:async(gid,id)=>{delete D.groups[gid].expenses[id];save();},
    updateMember:async(gid,mid,p)=>{Object.assign(D.groups[gid].members[mid],p);save();},
    removeMember:async(gid,mid)=>{delete D.groups[gid].members[mid];save();},
    addGuest:async(gid,name)=>{D.groups[gid].members['m'+rid()]={uid:null,name,role:'member',status:'active',guest:true};save();},
    updateGroup:async(uid,gid,code,p)=>{Object.assign(D.groups[gid],p);save();},
    leave:async(uid,gid)=>{delete D.groups[gid].members[uid];delete D.my[gid];save();}
  };
}

/* ================= Hesap ================= */
const active=()=>S.members.filter(m=>m.status==='active').sort((a,b)=>cmp(a.name||'',b.name||''));
const me=()=>S.user&&S.members.find(m=>m.id===S.user.uid);
const isAdmin=()=>{const m=me();return!!(m&&m.role==='admin');};
const nameOf=id=>{const m=S.members.find(x=>x.id===id);return m?m.name:'Ayrılan üye';};
const monthList=()=>S.expenses.filter(e=>e.month===S.month).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
function compute(list){
  const ids=new Set(active().map(m=>m.id));list.forEach(e=>{ids.add(e.payer);(e.participants||[]).forEach(p=>ids.add(p));});
  const paid={},share={};ids.forEach(i=>{paid[i]=0;share[i]=0;});
  list.forEach(e=>{const ps=[...(e.participants||[])].sort();const n=ps.length;if(!n)return;
    paid[e.payer]+=e.amount;const base=Math.floor(e.amount/n);let rem=e.amount-base*n;
    ps.forEach(p=>{share[p]+=base+(rem>0?1:0);if(rem>0)rem--;});});
  const rows=[...ids].map(i=>({id:i,name:nameOf(i),paid:paid[i],share:share[i],net:paid[i]-share[i]}))
    .filter(r=>r.paid||r.share||active().some(m=>m.id===r.id)).sort((a,b)=>cmp(a.name,b.name));
  const cr=rows.filter(r=>r.net>0).map(r=>({n:r.name,v:r.net})).sort((a,b)=>b.v-a.v);
  const db=rows.filter(r=>r.net<0).map(r=>({n:r.name,v:-r.net})).sort((a,b)=>b.v-a.v);
  const tr=[];let i=0,j=0;
  while(i<db.length&&j<cr.length){const x=Math.min(db[i].v,cr[j].v);if(x>0)tr.push({from:db[i].n,to:cr[j].n,v:x});
    db[i].v-=x;cr[j].v-=x;if(!db[i].v)i++;if(!cr[j].v)j++;}
  return{rows,tr,total:list.reduce((s,e)=>s+e.amount,0)};
}

function render(){
  const a=document.activeElement;
  if(a&&a.tagName==='INPUT'&&app.contains(a)&&a.type!=='checkbox'&&S.view!=='loading'&&!render.force){deferred=true;return;}
  render.force=false;deferred=false;
  let h='';
  switch(S.view){
    case'loading':h='<div class="spin" role="status" aria-label="Yükleniyor"></div>';break;
    case'error':h=`<div class="hero"><div class="logo">₺</div><h1>Mahsup</h1><p>${esc(S.err)}</p></div><button class="btn" data-act="reload">Yeniden dene</button>`;break;
    case'login':h=vLogin();break;case'home':h=vHome();break;case'create':h=vCreate();break;
    case'join':h=vJoin();break;case'group':h=vGroup();break;case'add':h=vAdd();break;
  }
  app.innerHTML=h;
  if(S.view==='add')updHint();
}
const rr=()=>{render.force=true;render();};
const go=v=>{S.view=v;render.force=true;render();window.scrollTo(0,0);};
app.addEventListener('focusout',()=>setTimeout(()=>{if(deferred&&!(document.activeElement&&document.activeElement.tagName==='INPUT'&&app.contains(document.activeElement)))render();},0));

function updHint(){
  const h=$('#aHint');if(!h)return;const n=(S.draft.parts||active().map(m=>m.id)).length,a=parseAmount(S.draft.amount);
  h.textContent=n?n+' kişi'+(a>0?' · kişi başı yaklaşık '+fmt(Math.floor(a/n)):''):'En az bir kişi seçin.';
}

/* ================= Akış ================= */
function closeGroup(){if(unG){unG();unG=null;}S.gid=null;S.g=null;S.members=[];S.expenses=[];}
function openGroup(gid){
  closeGroup();S.gid=gid;S.tab='giderler';S.month=today().slice(0,7);go('group');
  unG=B.watchGroup(gid,st=>{
    if(S.gid!==gid)return;
    if(!st.group&&!B.demo&&st.members.length===0)return;
    S.g=st.group;S.members=st.members;S.expenses=st.expenses;
    if(S.user&&S.g&&!S.members.some(m=>m.id===S.user.uid&&m.status==='active')&&S.members.length){toast('Bu gruptan çıkarıldınız.');closeGroup();return go('home');}
    if(S.view==='group'||S.view==='add')render();
  },()=>{toast('Bu gruba erişiminiz yok.');closeGroup();go('home');});
}
function startDraft(){
  const act=active(),mine=act.some(m=>m.id===S.user.uid);
  const t=today();
  S.draft={amount:'',desc:'',payer:mine?S.user.uid:(act[0]&&act[0].id),parts:null,date:t.slice(0,7)===S.month?t:S.month+'-01'};
}
async function afterJoin(r){
  S.joinCode='';try{history.replaceState(null,'',location.pathname)}catch(e){}
  if(r.status==='pending'){toast('Katılım isteğiniz yöneticiye iletildi. Onaylanınca grup açılacak.');go('home');}
  else openGroup(r.gid);
}

app.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-open],[data-type],[data-payer],[data-part],[data-del],[data-approve],[data-rm]');if(!t)return;
  const d=t.dataset;
  if(d.open){const g=S.groups.find(x=>x.id===d.open);if(g&&g.status==='pending')return toast('Yönetici onayı bekleniyor. Onaylanınca grup açılacak.');return openGroup(d.open);}
  if(d.type){S.newG.type=d.type;return rr();}
  if(d.payer){S.draft.payer=d.payer;return rr();}
  if(d.part){const all=active().map(m=>m.id);let p=(S.draft.parts||all).slice();p=p.includes(d.part)?p.filter(x=>x!==d.part):p.concat(d.part);S.draft.parts=p;return rr();}
  if(d.del)return armed(t,'Silinsin mi?',()=>B.delExpense(S.gid,d.del).then(()=>toast('Gider silindi.')));
  if(d.approve)return B.updateMember(S.gid,d.approve,{status:'active'}).then(()=>toast('Üye onaylandı.')).catch(fail);
  if(d.rm)return armed(t,'Emin misiniz?',()=>B.removeMember(S.gid,d.rm).then(()=>toast('Üye gruptan çıkarıldı. Eski giderleri korunur.')));
  switch(d.act){
    case'reload':return location.reload();
    case'google':return B.google().catch(fail);
    case'reset':{const em=($('#em')||{}).value;if(!em)return toast('Önce e-posta adresinizi yazın.');
      return B.reset(em.trim()).then(()=>toast('Şifre sıfırlama bağlantısı e-postanıza gönderildi.')).catch(fail);}
    case'logout':return B.signOut();
    case'home':closeGroup();return go('home');
    case'group':return go('group');
    case'toCreate':S.newG={name:'',type:'ofis',myName:S.user.name||'',approval:false};return go('create');
    case'toJoin':return go('join');
    case'tabG':S.tab='giderler';return go('group');
    case'tabS':S.tab='grup';return go('group');
    case'toAdd':if(!active().length)return toast('Önce gruba üye ekleyin.');startDraft();return go('add');
    case'allParts':{const all=active().map(m=>m.id);S.draft.parts=(S.draft.parts||all).length===all.length?[]:null;return rr();}
    case'prev':case'next':{let[y,m]=S.month.split('-').map(Number);m+=d.act==='next'?1:-1;if(m<1){m=12;y--;}if(m>12){m=1;y++;}S.month=y+'-'+pad(m);return rr();}
    case'copyLink':return copy(location.origin+location.pathname+'?kod='+S.g.code,'Davet linki kopyalandı.');
    case'copyCode':return copy(showCode(S.g.code),'Kod kopyalandı.');
    case'report':return copy(reportText(),'Rapor kopyalandı.');
    case'leave':return armed(t,'Ayrılmak istediğinize emin misiniz?',async()=>{const g=S.gid;closeGroup();await B.leave(S.user.uid,g);toast('Gruptan ayrıldınız.');go('home');});
  }
});
app.addEventListener('input',e=>{
  const id=e.target.id;
  if(S.view==='add'&&S.draft){if(id==='aAmt'){S.draft.amount=e.target.value;updHint();}if(id==='aDesc')S.draft.desc=e.target.value;if(id==='aDate')S.draft.date=e.target.value;}
  if(S.view==='create'&&S.newG){if(id==='gName')S.newG.name=e.target.value;if(id==='myName')S.newG.myName=e.target.value;if(id==='gAppr')S.newG.approval=e.target.checked;}
});
app.addEventListener('change',e=>{
  if(e.target.id==='gAppr'&&S.newG)S.newG.approval=e.target.checked;
  if(e.target.id==='gApprToggle')B.updateGroup(S.user.uid,S.gid,S.g.code,{approval:e.target.checked}).then(()=>toast(e.target.checked?'Katılımlar artık onayınızla olacak.':'Kodu bilen herkes doğrudan katılabilir.')).catch(fail);
});
app.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target.id,btn=e.target.querySelector('[type=submit]');
  const run=async fn=>{if(btn)btn.disabled=true;try{await fn();}catch(err){fail(err);}if(btn&&btn.isConnected)btn.disabled=false;};
  if(f==='emailForm'){const em=$('#em').value.trim(),pw=$('#pw').value;
    if(!em)return toast('E-posta adresinizi yazın.');if(pw.length<6)return toast('Şifre en az 6 karakter olmalı.');
    return run(()=>B.email(em,pw));}
  if(f==='createForm'){const n=S.newG;n.name=$('#gName').value.trim();n.myName=$('#myName').value.trim();n.approval=$('#gAppr').checked;
    if(!n.name)return toast('Grubun adını yazın.');if(!n.myName)return toast('Gruptaki adınızı yazın.');
    return run(async()=>{const gid=await B.createGroup(S.user,n);toast('Grup kuruldu. Şimdi kişileri davet edin.');openGroup(gid);});}
  if(f==='joinForm'){const code=normCode($('#jCode').value),nm=$('#jName').value.trim();
    if(code.length!==10)return toast('Davet kodu 10 karakter olmalı.');if(!nm)return toast('Gruptaki adınızı yazın.');
    return run(async()=>afterJoin(await B.joinByCode(S.user,code,nm)));}
  if(f==='addForm'){const d=S.draft,amount=parseAmount($('#aAmt').value),desc=$('#aDesc').value.trim(),date=$('#aDate').value||today();
    const parts=(d.parts||active().map(m=>m.id)).slice();
    if(!(amount>0))return toast('Geçerli bir tutar yazın.');if(!desc)return toast('Giderin ne için olduğunu yazın.');
    if(!d.payer)return toast('Ödeyen kişiyi seçin.');if(!parts.length)return toast('Gideri bölüşecek en az bir kişi seçin.');
    return run(async()=>{await B.addExpense(S.gid,{payer:d.payer,amount,desc,date,month:date.slice(0,7),participants:parts,by:S.user.uid,createdAt:Date.now()});
      S.month=date.slice(0,7);S.tab='giderler';S.draft=null;toast('Gider kaydedildi.');go('group');});}
  if(f==='guestForm'){const n=$('#gGuest').value.trim();if(!n)return;
    if(S.members.some(m=>(m.name||'').toLocaleLowerCase('tr')===n.toLocaleLowerCase('tr')))return toast('Bu isimde bir üye zaten var.');
    return run(async()=>{await B.addGuest(S.gid,n);$('#gGuest').value='';toast(n+' eklendi.');});}
  if(f==='renameG'){const n=$('#rgName').value.trim();if(!n)return;return run(async()=>{await B.updateGroup(S.user.uid,S.gid,S.g.code,{name:n});toast('Grup adı güncellendi.');});}
  if(f==='renameMe'){const n=$('#rmName').value.trim();if(!n)return;return run(async()=>{await B.updateMember(S.gid,S.user.uid,{name:n});toast('Adınız güncellendi.');});}
});

function reportText(){
  const list=monthList(),{rows,tr,total}=compute(list);
  const L=[S.g.name.toUpperCase()+' — '+monthName(S.month).toUpperCase(),'Toplam gider: '+fmt(total)+' ('+list.length+' kalem)','','KİŞİ BAZINDA'];
  rows.forEach(r=>L.push(r.name+': ödedi '+fmt(r.paid)+', payı '+fmt(r.share)+', bakiye '+sfmt(r.net)));
  L.push('','AY SONU ÖDEMELERİ');if(tr.length)tr.forEach(t=>L.push(t.from+' → '+t.to+': '+fmt(t.v)));else L.push('Transfer gerekmiyor.');
  L.push('','GİDERLER');
  list.slice().reverse().forEach(e=>L.push((e.date||'').split('-').reverse().slice(0,2).join('.')+' · '+nameOf(e.payer)+' · '+fmt(e.amount)+' · '+e.desc+' ('+(e.participants||[]).map(nameOf).join(', ')+')'));
  return L.join('\n');
}

(async function boot(){
  try{B=window.FIREBASE_CONFIG?await firebaseBackend(window.FIREBASE_CONFIG):localBackend();}
  catch(e){S.err='Sunucuya bağlanılamadı. İnternet bağlantınızı kontrol edip yeniden deneyin.';return go('error');}
  S.demo=!!B.demo;
  B.onAuth(u=>{
    S.user=u;if(unMy){unMy();unMy=null;}closeGroup();
    if(!u)return go('login');
    unMy=B.watchMyGroups(u.uid,list=>{S.groups=list;if(S.view==='home')render();});
    go(S.joinCode?'join':'home');
  });
})();
})();
</script>
